MODEL:    
  dim_sizes: np.array([40])
  area_lims: np.array([[-1., 1.]])
  power: 5

WEIGHTS:
    border_weight: 200
    colloc_weight: 1.5
    connect_weights: np.array([10, 5])

NS:
  nx: [100, 100]

IN_VAR_NAMES:
 [t]

OUT_VAR_NAMES:
 ['S', 'I', 'uS', 'uI']

CUSTOMS:
    beta_max: 20. #'lambda u_: u_(func=4)', #20,
    cost_inf: 4.
    gamma: 2
    S0: 0.7
    w: 0.1
    c: 'lambda u_: (np.abs( beta_max *( uS - uI - w ) * I / 2.))'
    #approximation for inverse function of u*(1+exp(u))*(1+exp(-u))
    approximation: 'lambda u_: bisect(lambda x: (x*(1+np.exp(x))*(1+np.exp(-x)) - c(u_)), 0, 40)
    
    #u_:-2297.36352851433+23884.674971297107*np.sqrt(c(u_))-34163.4601977002*c(u_)+14820.660457620688*c(u_)**2-3667.377703202437*c(u_)**3+423.91363785127453*c(u_)**4-18.863552127372177*c(u_)**5+14.581079931215502*np.exp(c(u_))+6.233749044074204e-07*np.exp(2*c(u_))-1.25518026388014e-13*np.exp(3*c(u_))+1.2457970739369883e-20*np.exp(4*c(u_))'
    c_sign: 'lambda u_: np.sign(( uS - uI - w ))'
    alpha: 'lambda u_: c_sign(u_) * approximation(u_)'
    beta: 'lambda u_: beta_max/(1+np.exp(-alpha(u_)))'
    small: 0.00001
    border_weight: 1.
    
    border: 'lambda sol, x, variable_num, border_side: border_weight * int(abs(x[variable_num] - sol.area_lims[variable_num, border_side]) < 1e-8)'


CONDITIONS:
    pde:
      left: 
        - '- (d/dt) S - beta(u_loc) * (( S * &I ) + ( &S * I )) '
        - '- (d/dt) I + beta(u_loc) * (( S * &I ) + ( &S * I )) - gamma * I '  
        - '- (d/dt) uS - ( beta(u_loc) * ( &I * ( - uS + uI ) + I * ( - &uS + &uI )))'
        #- '- (d/dt) uS - ( beta(u_loc) * ( &I * ( - uS + uI ) + I * ( - &uS + &uI )))'
        - '- (d/dt) uI - ( -gamma * uI )'
        - '(beta_max * ( uS - uI ) * &I  + beta_max * ( &uS - &uI - w ) * I ) / 2'
      right: 
        - '- beta(u_loc) * (( &S * &I ))'
        - 'beta(u_loc) * (( &S * &I ))'
        - 'alpha(u_loc)**2 - beta(u_loc) * ( &I * ( - &uS + &uI - w))'
        - 'cost_inf'
        - 'beta_max * ( &uS - &uI ) * &I / 2 + alpha(u_loc)*(1+np.exp(-alpha(u_loc)))*(1+np.exp(alpha(u_loc)))'
      points: default
    
    border:
      left:
        - 'border(sol,x,0,0) * S'
        - 'border(sol,x,0,0) * I'
        - 'border(sol,x,0,1) * uS'
        - 'border(sol,x,0,1) * uI'
      right: 
        - 'border(sol,x,0,0) * ( S0 )'
        - 'border(sol,x,0,0) * ( 1 - S0 )'
        - 'border(sol,x,0,1) * 0'
        - 'border(sol,x,0,1) * 0'
      points: '[[1.],[-1.]]'
      type: border
    
    #data:
    #  left:
    #    - 'I*0'
    #  right: 
    #    - '0'
    #  points: default
    #  type: data
    
